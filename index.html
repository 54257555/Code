  html[data-theme="light"]{
    --bg:#f4f6fb;

    --card-hover:#ffffff;
    --border:rgba(15,23,42,.09);
    --border-hover:rgba(37,99,235,.55);
    --text:#0f172a;
    --muted:#5a6b86;
    --accent:#2563eb;

  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:

      radial-gradient(640px 480px at 90% 0%, rgba(124,92,255,.18), transparent 62%),
      radial-gradient(900px 620px at 50% 112%, rgba(6,182,212,.13), transparent 62%);
    pointer-events:none;
    z-index:0;
  }
  html[data-theme="light"] body::before{opacity:.55;}

  a{color:inherit;}
  .wrap{max-width:1220px;margin:0 auto;padding:0 20px;}

  /* ---------- 顶部导航 ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:var(--nav);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#4f8cff,#7c5cff);
    font:800 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(79,140,255,.95);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-size:15px;letter-spacing:.02em;}
  .brand-text small{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .count{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    cursor:pointer;font-size:15px;transition:.2s;
  }
  .icon-btn:hover{border-color:var(--border-hover);transform:translateY(-1px);}

  /* ---------- Hero ---------- */
  .hero{position:relative;z-index:1;padding:60px 0 26px;text-align:center;}
  .hero h1{
    margin:0 0 14px;font-size:clamp(26px,4.6vw,46px);
    line-height:1.14;letter-spacing:-.025em;font-weight:800;
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(115deg,#4f8cff,#8b5cf6 48%,#22d3ee);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:0 0 28px;color:var(--muted);font-size:15px;}

  .search{
    max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-radius:14px;
    background:var(--card);border:1px solid var(--border);
    transition:.22s;backdrop-filter:blur(8px);
  }
  .search:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--glow);
    transform:translateY(-1px);
  }
  .search svg{flex:0 0 18px;color:var(--muted);}
  .search input{
    flex:1;min-width:0;background:none;border:0;outline:0;
    color:var(--text);font-size:15px;font-family:inherit;
  }
  .search input::placeholder{color:var(--muted);}
  .search kbd{
    font:600 11px/1 ui-monospace,Menlo,monospace;
    padding:5px 8px;border-radius:7px;color:var(--muted);
    background:rgba(127,127,127,.12);border:1px solid var(--border);
  }

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px;}
  .chip{
    padding:7px 15px;border-radius:999px;font-size:13px;font-family:inherit;
    color:var(--muted);background:var(--card);border:1px solid var(--border);
    cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .chip:hover{color:var(--text);border-color:var(--border-hover);transform:translateY(-1px);}
  .chip.active{
    background:linear-gradient(135deg,#4f8cff,#7c5cff);
    color:#fff;border-color:transparent;
    box-shadow:0 10px 22px -10px rgba(79,140,255,.95);
  }

  main{position:relative;z-index:1;padding:34px 0 70px;}
  .grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  }
  .card{
    position:relative;display:flex;gap:13px;padding:15px;
    border-radius:15px;text-decoration:none;
    background:var(--card);border:1px solid var(--border);
    transition:transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, background .22s, box-shadow .22s;
    overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(300px 120px at 100% 0%, rgba(79,140,255,.18), transparent 70%);
    opacity:0;transition:opacity .25s;
  }
  .card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    border-color:var(--border-hover);
    box-shadow:var(--shadow);
  }
  .card:hover::after{opacity:1;}
  .card .logo{
    flex:0 0 44px;width:44px;height:44px;border-radius:12px;
    display:grid;place-items:center;
    font:800 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#fff;letter-spacing:.02em;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .card .body{min-width:0;flex:1;}
  .card .name{
    display:flex;align-items:center;gap:6px;
    font-size:15px;font-weight:650;letter-spacing:-.005em;
  }
  .card .name .arrow{
    opacity:0;transform:translate(-4px,4px);transition:.22s;color:var(--accent);
    flex:0 0 auto;
  }
  .card:hover .name .arrow{opacity:1;transform:none;}
  .card .desc{
    margin-top:5px;font-size:12.5px;line-height:1.55;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .empty{
    display:none;text-align:center;padding:70px 20px;color:var(--muted);
  }
  .empty .big{font-size:38px;margin-bottom:12px;opacity:.6;}

  footer{
    position:relative;z-index:1;
    border-top:1px solid var(--border);

  footer .tiny{font-size:11.5px;opacity:.75;}

  @media (max-width:640px){
    .hero{padding:38px 0 18px;}
    .count{display:none;}
    .grid{grid-template-columns:1fr;}
    .search kbd{display:none;}

</style>

/* ===================== 渲染逻辑 ===================== */
const gridEl   = document.getElementById('grid');
const chipsEl  = document.getElementById('chips');
const qEl      = document.getElementById('q');
const emptyEl  = document.getElementById('empty');
const countEl  = document.getElementById('count');
const themeBtn = document.getElementById('themeBtn');

let curCat = 'all';
let curKw  = '';

/* 生成 logo 文字 */
function logoText(name){
  const en = name.match(/^[A-Za-z][A-Za-z0-9.+#-]*/);
  if (en){
    const s = en[0].replace(/[^A-Za-z0-9]/g, '');
    return s.slice(0, 2).replace(/^./, c => c.toUpperCase());
  }
  return name.slice(0, 2);
}

/* 生成分类筛选按钮 */
const catOrder = ['all', ...Object.keys(CATS)];
chipsEl.innerHTML = catOrder.map(k => {
  const label = k === 'all' ? '全部' : CATS[k].name;
  return `<button class="chip${k === 'all' ? ' active' : ''}" data-cat="${k}">${label}</button>`;
}).join('');

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  curCat = btn.dataset.cat;
  chipsEl.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

/* 卡片模板 */
function cardHTML(item){
  const cat = CATS[item.c] || { name:'其他', color:'linear-gradient(135deg,#64748b,#94a3b8)' };
  return `<a class="card" href="${item.u}" target="_blank" rel="noopener noreferrer" title="${item.n}">
    <span class="logo" style="background:${cat.color}">${logoText(item.n)}</span>
    <span class="body">
      <span class="name">${item.n}
        <svg class="arrow" viewBox="0 0 24 24" width="13" height="13" fill="none"
             stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"></path>
        </svg>
      </span>
      <span class="desc">${item.d}</span>
    </span>
  </a>`;
}

/* 渲染 */
function render(){
  const kw = curKw.trim().toLowerCase();
  const list = DATA.filter(item => {
    if (curCat !== 'all' && item.c !== curCat) return false;
    if (!kw) return true;
    const hay = (item.n + ' ' + item.d + ' ' + (item.t || '') + ' ' + item.u).toLowerCase();
    return hay.includes(kw);
  });

  gridEl.innerHTML = list.map(cardHTML).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
  countEl.textContent = list.length + ' 个资源';
}

/* 搜索 */
let timer = null;
qEl.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { curKw = qEl.value; render(); }, 90);
});

/* 快捷键：/ 聚焦搜索，Esc 清空 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl){
    e.preventDefault();
    qEl.focus();
  }
  if (e.key === 'Escape' && document.activeElement === qEl){
    qEl.value = ''; curKw = ''; render(); qEl.blur();
  }
});

/* 主题切换 */
const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
themeBtn.textContent = document.documentElement.dataset.theme === 'light' ? '🌙' : '☀️';

themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'light' ? '🌙' : '☀️';
});

/* 初始化 */
render();
</script>
